# Weekly backup of the account data (the free Supabase plan has no backups of its own).
# The dump is encrypted before it leaves the runner: this repository is public, so only someone with the
# passphrase can read a backup. Kept as a workflow artifact for 90 days.
# Off until you add two repository secrets (Settings → Secrets and variables → Actions), see supabase/README.md:
#   SUPABASE_DB_URL     the Session pooler connection string (Dashboard → Connect), with your database password
#   BACKUP_PASSPHRASE   a long passphrase you keep somewhere safe (a password manager)
name: Backup
on:
  schedule:
    - cron: "0 8 * * 0" # Sundays, 4 AM New York time
  workflow_dispatch:

permissions: {contents: read}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        id: ready
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Backups are off: add SUPABASE_DB_URL and BACKUP_PASSPHRASE (see supabase/README.md)." >> "$GITHUB_STEP_SUMMARY"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else echo "on=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install the Postgres 17 client
        if: steps.ready.outputs.on == 'true'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
      - name: Dump and encrypt
        if: steps.ready.outputs.on == 'true'
        run: |
          set -euo pipefail
          umask 077
          day=$(date -u +%F)
          mkdir -p "$RUNNER_TEMP/b"
          # The people (who owns what) and every table the app keeps.
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "\copy (select id, email, created_at from auth.users) to '$RUNNER_TEMP/b/users.csv' with csv header"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --data-only --schema=public --no-owner --no-privileges -f "$RUNNER_TEMP/b/public-data.sql"
          tar -C "$RUNNER_TEMP/b" -czf - . | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "$RUNNER_TEMP/backup-$day.tar.gz.gpg"
          rm -rf "$RUNNER_TEMP/b"
          echo "Backup $day: $(du -h "$RUNNER_TEMP/backup-$day.tar.gz.gpg" | cut -f1), encrypted." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.on == 'true'
        with:
          name: backup
          path: ${{ runner.temp }}/backup-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

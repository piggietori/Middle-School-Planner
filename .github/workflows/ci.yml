name: CI
on:
  pull_request:
  push:
    branches: [main, v1]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a normal run takes 2–3 minutes; a hang (say Ubuntu's package servers down) fails instead of running 6 hours
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run lint
      - name: Data checks
        run: node scripts/validate-data.js ${{ github.base_ref && format('--base origin/{0}', github.base_ref) || '' }}
      - name: Release notes
        run: node scripts/check-changelog.js
      - run: npm test
      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 10
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-report, path: playwright-report/, retention-days: 7}

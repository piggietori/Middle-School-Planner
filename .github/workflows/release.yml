# Publishes a GitHub Release when a version tag is pushed, with that version's notes from CHANGELOG.md.
# Release steps: docs/operations.md (Making changes).
name: Release
on:
  push:
    tags: ["v*"]

permissions: {contents: write}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - name: Check the tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then echo "Tag $GITHUB_REF_NAME doesn't match package.json version $v." >&2; exit 1; fi
      - name: Publish the release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          node scripts/check-changelog.js --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
